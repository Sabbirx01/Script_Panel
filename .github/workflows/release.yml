name: Build and publish release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      version:
        description: 'Release version, for example 1.1.0'
        required: true
        default: '1.1.0'
      notes:
        description: 'Release notes'
        required: false
        default: 'GitHub auto-update release.'

permissions:
  contents: write
  # Needed to kick pages.yml: a push made with GITHUB_TOKEN does NOT trigger
  # other workflows, so the feed commit alone left GitHub Pages serving the
  # previous update.json - the same "no update" the commit was meant to fix.
  actions: write

env:
  DOTNET_VERSION: '10.0.x'

jobs:
  release:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}

      - name: Build self-contained panel
        shell: pwsh
        run: powershell -NoProfile -ExecutionPolicy Bypass -File source/build.ps1

      - name: Assemble safe update package
        shell: pwsh
        run: |
          $v = '${{ inputs.version }}'
          if (-not $v) { $v = '${{ github.ref_name }}' }
          $tag = if ($v.StartsWith('v')) { $v } else { "v$v" }
          $stage = Join-Path $env:RUNNER_TEMP 'release-stage'
          $out = Join-Path $env:RUNNER_TEMP 'release-out'
          New-Item -ItemType Directory -Force -Path $stage,$out | Out-Null
          Copy-Item 'output/DeveloperXBulkAccPanel.exe' "$stage/DeveloperXBulkAccPanel.exe"
          if (Test-Path 'output/.playwright') { Copy-Item 'output/.playwright' "$stage/.playwright" -Recurse -Force }
          Set-Content "$stage/release-info.txt" -Encoding UTF8 -Value @(
            "Developer X Bulk Acc Panel $tag"
            "Repository: https://github.com/Sabbirx01/Script_Panel"
            "Licence: online RSA validation remains required"
          )
          $zip = Join-Path $out "DeveloperXBulkAccPanel-$tag.zip"
          Compress-Archive -Path "$stage/*" -DestinationPath $zip -CompressionLevel Optimal
          $hash = (Get-FileHash $zip -Algorithm SHA256).Hash.ToLowerInvariant()
          Set-Content "$zip.sha256" -Encoding ASCII -Value "sha256:$hash"
          "VERSION=$v" >> $env:GITHUB_ENV
          "TAG=$tag" >> $env:GITHUB_ENV
          "ZIP=$zip" >> $env:GITHUB_ENV
          "HASH=$hash" >> $env:GITHUB_ENV
          "OUT=$out" >> $env:GITHUB_ENV
          Write-Host "package=$zip"
          Write-Host "sha256=$hash"

      - name: Publish GitHub release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.TAG }}
          name: Developer X Bulk Acc Panel ${{ env.TAG }}
          body: ${{ inputs.notes || 'Developer X Bulk Acc Panel release' }}
          generate_release_notes: true
          draft: false
          prerelease: false
          files: |
            ${{ env.OUT }}/*.zip
            ${{ env.OUT }}/*.sha256

      # The release used to say "publish update.json afterwards" and that step
      # kept being missed: v2.2.3 shipped while docs/update.json still named
      # 2.2.2, so every installed panel compared 2.2.2 with 2.2.2 and reported
      # "up to date" for ever. The feed and the download page are now written by
      # the release that creates the assets, from the digest of the zip this
      # workflow just built - there is nothing left to remember.
      - name: Publish the update feed and download page
        if: success()
        continue-on-error: true
        shell: pwsh
        run: |
          $v = $env:VERSION
          $plain = if ($v.StartsWith('v')) { $v.Substring(1) } else { $v }
          $tag = $env:TAG
          $zip = $env:ZIP
          $hash = $env:HASH
          $size = (Get-Item $zip).Length
          $url = "https://github.com/Sabbirx01/Script_Panel/releases/download/$tag/DeveloperXBulkAccPanel-$tag.zip"
          $notes = '${{ inputs.notes }}'
          if ([string]::IsNullOrWhiteSpace($notes)) { $notes = "Developer X Bulk Acc Panel $tag" }

          git fetch origin main
          git checkout main
          git pull --ff-only origin main

          $feed = [ordered]@{
            version    = $plain
            tag        = $tag
            published  = (Get-Date).ToUniversalTime().ToString('yyyy-MM-ddTHH:mm:ssZ')
            notes      = $notes
            packageUrl = $url
            sha256     = $hash
            size       = $size
          }
          $feed | ConvertTo-Json -Compress | Set-Content -LiteralPath 'docs/update.json' -Encoding utf8 -NoNewline

          # The page's offline fallback still has to name the newest file, or a
          # customer whose feed and API call both fail is offered the old zip.
          $html = Get-Content -LiteralPath 'docs/index.html' -Raw
          $pattern = "fallback:\{tag:'[^']*',name:'[^']*',size:\d+,url:'[^']*',digest:'[^']*'\}"
          $replacement = "fallback:{tag:'$tag',name:'DeveloperXBulkAccPanel-$tag.zip',size:$size,url:'$url',digest:'sha256:$hash'}"
          if ($html -match $pattern) {
            $html = [regex]::Replace($html, $pattern, $replacement)
            Set-Content -LiteralPath 'docs/index.html' -Value $html -Encoding utf8 -NoNewline
          } else {
            Write-Warning 'docs/index.html fallback block not found - left unchanged'
          }

          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add docs/update.json docs/index.html
          if (-not (git diff --cached --quiet)) {
            git commit -m "release: point the update feed at $plain [skip ci]"
            git push origin main
          } else {
            Write-Host 'feed already current'
          }

      - name: Deploy the refreshed download page
        if: success()
        continue-on-error: true
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run pages.yml --repo ${{ github.repository }} --ref main
